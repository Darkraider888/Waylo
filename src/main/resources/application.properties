spring.application.name=Waylo
server.port=${PORT:8080}

spring.datasource.url=${WAYLO_DB_URL}
spring.datasource.username=${WAYLO_DB_USERNAME}
spring.datasource.password=${WAYLO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db
spring.flyway.baseline-on-migrate=false

# Password-reset emails: HTTPS API, not SMTP (Render Free blocks SMTP ports)
waylo.resend.api-key=${WAYLO_RESEND_API_KEY:}
waylo.resend.from=${WAYLO_RESEND_FROM:onboarding@resend.dev}

# Absolute URL used in password-reset emails
waylo.public-url=${WAYLO_PUBLIC_URL:http://localhost:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Optional Google Maps Embed API key
# Leave empty if you only want "Open in Google Maps"
waylo.google-maps-embed-key=${WAYLO_GOOGLE_MAPS_EMBED_KEY:}
# Real user photos (local durable disk for demo; use object storage in production)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
waylo.upload-directory=${WAYLO_UPLOAD_DIRECTORY:./waylo-uploads}

# Caffeine caches PUBLIC destination summaries only, never credentials or private messages
spring.cache.type=caffeine
spring.cache.cache-names=publicDestinations
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=180s

# JWT API is off until you configure a strong signing secret
waylo.jwt.enabled=${WAYLO_JWT_ENABLED:false}
waylo.jwt.secret-base64=${WAYLO_JWT_SECRET_BASE64:}

# Signed server-side Cloudinary uploads for posts, avatars and trip covers.
# Set CLOUDINARY_URL only in IntelliJ environment / deployment secrets, not in Git.
waylo.cloudinary-url=${CLOUDINARY_URL:}

# SSLCommerz TEST gateway only. This build contains no live-payment code.
# Requires a publicly reachable HTTPS WAYLO_PUBLIC_URL for provider callbacks/IPN.
waylo.sslcommerz.enabled=${WAYLO_SSLCOMMERZ_ENABLED:false}
waylo.sslcommerz.store-id=${WAYLO_SSLCOMMERZ_STORE_ID:}
waylo.sslcommerz.store-password=${WAYLO_SSLCOMMERZ_STORE_PASSWORD:}
