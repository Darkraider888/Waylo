<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waylo</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/social.css}"><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/theme.js}" defer></script><script th:src="@{/js/app.js}" defer></script></head><body class="social-app"><header th:replace="~{fragments/nav :: navbar('profile')}"></header><main class="edit-shell"><div th:if="${error}" th:text="${error}" class="alert alert-error" role="alert"></div><div th:if="${success}" th:text="${success}" class="alert alert-success" role="status"></div><h1>Your updates.</h1><p th:if="${#lists.isEmpty(notifications)}">No notifications yet.</p><article class="editor-card" th:each="item : ${notifications}"><p th:text="${item.message}">Message</p><time th:text="${item.created_at}"></time><p><a th:href="${item.link}">Open details</a></p><form th:if="${item.read_at == null}" method="post" th:action="@{/notifications/{id}/read(id=${item.id})}"><button type="submit">Mark as read</button></form><small th:if="${item.read_at != null}">Read</small></article></main></body></html>
