<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Waylo</title><link rel="stylesheet" th:href="@{/css/auth.css}">
<link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/social.css}">
<link rel="stylesheet" th:href="@{/css/recovery.css}">
<script th:src="@{/js/theme.js}" defer></script><script th:src="@{/js/password.js}" defer></script><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/app.js}" defer></script></head>
<body class="social-app"><header th:replace="~{fragments/nav :: navbar('account')}"></header>
<main class="recovery-shell"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Choose a new password.</h1>
    <p class="muted">Create a strong password to protect your travel account.</p>
    <div class="recovery-card">
        <div class="alert alert-error" th:if="${invalid}">This reset link has expired or was already used.
            <a th:href="@{/forgot-password}">Request a new link.</a></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
        <form th:unless="${invalid}" th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <label for="password">New password</label>
            <div class="password-wrapper"><input id="password" name="password" type="password" minlength="8" maxlength="72"
                 autocomplete="new-password" placeholder="Enter a strong password" required>
                <button class="password-toggle" type="button" data-password-toggle="password">Show</button></div>
            <p class="recovery-note">8–72 characters, including uppercase, lowercase and a number.</p>
            <label for="confirmPassword">Confirm password</label>
            <div class="password-wrapper"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
                 placeholder="Repeat your password" required>
                <button type="button" class="password-toggle" data-password-toggle="confirmPassword">Show</button></div>
            <button class="action-primary full-button" type="submit">Save new password →</button>
        </form>
        <a class="backlink" th:href="@{/login}">← Back to login</a>
    </div>
</main></body></html>
