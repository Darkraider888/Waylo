<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password | Waylo</title>
<link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/theme.css}">
<link rel="stylesheet" th:href="@{/css/social.css}"><link rel="stylesheet" th:href="@{/css/recovery.css}">
<script th:src="@{/js/theme.js}" defer></script><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/app.js}" defer></script></head>
<body class="social-app"><header th:replace="~{fragments/nav :: navbar('account')}"></header>
<main class="recovery-shell"><span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1>Forgot your password?</h1><p class="muted">Enter the email address associated with your Waylo account.</p>
    <div class="recovery-card">
        <div th:if="${error}" class="alert alert-error" th:text="${error}" role="alert"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}" role="status"></div>
        <form th:action="@{/forgot-password}" method="post">
            <label for="email">Email address</label>
            <input type="email" name="email" id="email" maxlength="150" placeholder="you@example.com" autocomplete="email" required>
            <button class="action-primary full-button" type="submit">Send reset link →</button>
        </form>
        <p class="recovery-note">For security, the confirmation looks the same whether an account exists or not. Check spam if you don't see a message.</p>
        <a class="backlink" th:href="@{/login}">← Back to login</a>
    </div>
</main></body></html>
