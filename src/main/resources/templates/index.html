<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Waylo — Explore. Connect. Go.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172238;
        }

        header {
            padding: 24px 8%;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            color: #087f72;
            text-decoration: none;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 100px 24px;
            text-align: center;
        }

        .eyebrow {
            color: #087f72;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 20px 0;
            font-size: clamp(40px, 8vw, 76px);
            line-height: 1.1;
        }

        .description {
            max-width: 580px;
            margin: 0 auto;
            color: #526078;
            font-size: 19px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 36px;
            padding: 12px 20px;
            border-radius: 24px;
            background: #dff5ec;
            color: #176344;
            font-weight: 600;
        }
    </style>
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/theme.js"></script>
<link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/app.js}" defer></script></head>
<body>

<header>
    <a class="brand" href="/">Waylo</a>
<button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme" aria-pressed="false"><span data-theme-icon aria-hidden="true">☾</span> <span data-theme-label>Dark mode</span></button>
</header>

<main>
    <p class="eyebrow">Your next journey starts here</p>

    <h1>Explore. Connect. Go.</h1>

    <p class="description">
        Discover beautiful destinations, join group adventures,
        and share the moments that make every journey memorable.
    </p>

    <p class="status">Waylo’s first milestone: we are running!</p>
</main>

</body>
</html>
