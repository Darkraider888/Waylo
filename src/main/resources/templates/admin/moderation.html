<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waylo</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/social.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><script th:src="@{/js/theme.js}" defer></script><script th:src="@{/js/social.js}" defer></script><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/app.js}" defer></script></head><body class="social-app"><header th:replace="~{fragments/nav :: navbar('feed')}"></header><main class="edit-shell"><div class="alert alert-error" th:if="${error}" th:text="${error}" role="alert"></div><div class="alert alert-success" th:if="${success}" th:text="${success}" role="status"></div><a th:href="@{/admin/dashboard}">Admin dashboard</a><h1>Platform operations.</h1><section class="overview-grid"><article th:each="item : ${overview}"><strong th:text="${item.value}">0</strong><span th:text="${item.key}">Metric</span></article></section><h2>Content reports</h2><p th:if="${#lists.isEmpty(reports)}">No reports have been submitted.</p><article class="editor-card" th:each="report : ${reports}"><h3 th:text="${report.target_type} + ' #' + ${report.target_id}">Report</h3><p th:text="${report.content_text}">Reported content</p><p th:text="${report.reason}">Reason</p><small th:text="${report.reporter_name} + ' · ' + ${report.status}">Status</small><form th:if="${report.status == 'OPEN'}" method="post" th:action="@{/admin/reports/{id}/review(id=${report.id})}"><label>Review reason<textarea name="reason" minlength="10" maxlength="500" required></textarea></label><button name="hide" value="true" type="submit">Hide content</button><button name="hide" value="false" type="submit">Dismiss report</button></form></article><h2>Recent audit history</h2><p>Most recent 200 actions. Records are retained in the database.</p><article class="editor-card" th:each="event : ${audit}"><strong th:text="${event.action}"></strong><p th:text="${event.full_name} + ' · ' + ${event.target_type} + ' #' + ${event.target_id}"></p><p th:text="${event.reason}"></p><time th:text="${event.created_at}"></time></article></main></body></html>
