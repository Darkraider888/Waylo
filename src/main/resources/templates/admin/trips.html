<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waylo</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/social.css}"><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/theme.js}" defer></script><script th:src="@{/js/app.js}" defer></script></head><body class="social-app"><header th:replace="~{fragments/nav :: navbar('profile')}"></header><main class="edit-shell"><div th:if="${error}" th:text="${error}" class="alert alert-error" role="alert"></div><div th:if="${success}" th:text="${success}" class="alert alert-success" role="status"></div><a th:href="@{/admin/dashboard}">Admin dashboard</a><h1>Trip moderation.</h1><p th:if="${#lists.isEmpty(trips)}">No published trips.</p><article class="editor-card" th:each="trip : ${trips}"><h2 th:text="${trip.title}">Trip</h2><p th:text="${trip.organizer.fullName}"></p><form method="post" th:action="@{/admin/trips/{id}/status(id=${trip.id})}"><label>Reason<textarea name="reason" minlength="10" maxlength="450" required></textarea></label><button type="submit" name="cancel" value="true">Cancel trip</button><button type="submit" name="cancel" value="false">Mark completed after departure</button><p>Cancellation closes booking and group access. Payment records are preserved; refunds require separate verified reconciliation.</p></form></article></main></body></html>
