<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waylo</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/social.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><script th:src="@{/js/theme.js}" defer></script><script th:src="@{/js/social.js}" defer></script><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/app.js}" defer></script></head><body class="social-app"><header th:replace="~{fragments/nav :: navbar('feed')}"></header><main class="edit-shell"><div class="alert alert-error" th:if="${error}" th:text="${error}" role="alert"></div><div class="alert alert-success" th:if="${success}" th:text="${success}" role="status"></div><h1>Edit your story.</h1><p>Your location tags stay attached to this story.</p><form class="editor-card" method="post" enctype="multipart/form-data" th:action="@{/posts/{id}/edit(id=${post.id})}"><label for="caption">Story</label><textarea id="caption" name="caption" maxlength="2000" rows="7" required th:text="${post.caption}"></textarea><label for="photo">Replace photo (optional)</label><input id="photo" type="file" name="photo" accept="image/jpeg,image/png"><img class="edit-preview" th:if="${post.imageUrl != null}" th:src="${post.imageUrl}" alt="Current story photo"><button type="submit" class="action-primary">Save story</button><a th:href="@{/posts/{id}(id=${post.id})}">Cancel</a></form></main></body></html>
