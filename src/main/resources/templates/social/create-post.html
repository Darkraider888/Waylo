<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share a story | Waylo</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/social.css}"><script th:src="@{/js/theme.js}" defer></script>
    <script th:src="@{/js/social.js}" defer></script>
<link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/app.js}" defer></script></head>
<body class="social-app">
<header th:replace="~{fragments/nav :: navbar('feed')}"></header>
<main class="edit-shell">
    <a class="backlink" th:href="@{/feed}">← Back to feed</a>
    <span class="eyebrow">SHARE YOUR JOURNEY</span><h1>Create a post</h1>
    <p class="muted">Show people a real place through your eyes. Photos are optional, stories are yours.</p>
    <form class="editor-card" th:action="@{/posts}" th:object="${postRequest}"
          method="post" enctype="multipart/form-data">
        <div th:if="${error}" class="alert alert-error" th:text="${error}" role="alert"></div>
        <label for="caption">Your travel story</label>
        <textarea id="caption" th:field="*{caption}" rows="6" maxlength="2000" required
                  placeholder="The best moment from this trip was..."></textarea>
        <div class="form-error" th:if="${#fields.hasErrors('caption')}" th:errors="*{caption}"></div>
        <label for="photo">Travel photo <span class="muted">(JPEG/PNG, max 6 MB)</span></label>
        <input type="file" id="photo" name="photo" accept="image/jpeg,image/png" data-photo-input>
        <div class="upload-preview" data-photo-preview hidden><img alt="Photo preview" data-photo-preview-image></div>
        <p class="muted tiny">Public photos are hosted on Cloudinary. GPS/EXIF metadata is removed during processing.</p>
        <label for="destinationId">Destination <span class="muted">(optional)</span></label>
        <select id="destinationId" th:field="*{destinationId}"><option value="">No destination</option>
            <option th:each="d : ${destinations}" th:value="${d.id}" th:text="${d.name}">Destination</option>
        </select>
        <label for="tripId">Tag a published trip <span class="muted">(optional)</span></label>
        <select id="tripId" th:field="*{tripId}"><option value="">No trip</option>
            <option th:each="trip : ${trips}" th:value="${trip.id}" th:text="${trip.title}">Trip</option>
        </select>
        <p class="muted tiny">If you tag a trip, its destination must match your selected destination.</p>
        <button class="action-primary full-button" type="submit">Publish story →</button>
    </form>
</main>
</body>
</html>
