<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit profile | Waylo</title><link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/social.css}">
    <script th:src="@{/js/theme.js}" defer></script><script th:src="@{/js/social.js}" defer></script><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/app.js}" defer></script></head>
<body class="social-app"><header th:replace="~{fragments/nav :: navbar('profile')}"></header>
<main class="edit-shell"><a class="backlink" th:href="@{/profile}">← My profile</a>
    <span class="eyebrow">YOUR SPACE</span><h1>Edit profile</h1>
    <p class="muted">Your profile photo is public and hosted on Cloudinary. Your email is not displayed.</p>
    <form class="editor-card" th:action="@{/profile/edit}" th:object="${profileRequest}"
          enctype="multipart/form-data" method="post">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <img th:if="${existingAvatarUrl != null}" th:src="${existingAvatarUrl}" alt="Current profile photo" class="edit-avatar">
        <label for="avatar">New profile photo <span class="muted">(optional, JPEG/PNG max 6 MB)</span></label>
        <input type="file" name="avatar" id="avatar" accept="image/jpeg,image/png" data-photo-input>
        <div class="upload-preview" data-photo-preview hidden><img alt="Preview" data-photo-preview-image></div>
        <label for="fullName">Name</label><input id="fullName" th:field="*{fullName}" maxlength="100" required>
        <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        <label for="profileLocation">Location</label><input id="profileLocation" th:field="*{profileLocation}" maxlength="150" placeholder="Dhaka, Bangladesh">
        <label for="bio">About me</label><textarea id="bio" th:field="*{bio}" rows="5" maxlength="500" placeholder="Where do you dream of going next?"></textarea>
        <button class="action-primary full-button" type="submit">Save profile →</button>
    </form>
</main></body></html>
